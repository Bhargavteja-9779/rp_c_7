name: tests
on: [push, pull_request]
jobs:
  tool:
    runs-on: ubuntu-latest
    strategy: {matrix: {python-version: ["3.10", "3.12"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - name: Install SurroSelect and test it
        working-directory: Reinforced_Research_Project/surroselect
        run: pip install -e ".[test]" && python -m pytest tests -q -k "not network"
